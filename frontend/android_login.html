<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cotizador · Acceso (Usuario)</title><style>body{font:16px system-ui;background:#0b2949;color:#172d45;display:grid;place-items:center;min-height:95vh;margin:0}main{background:white;padding:32px;border-radius:18px;width:min(450px,85vw)}input,button{box-sizing:border-box;width:100%;padding:12px;margin:6px 0}button{background:#087ebd;color:white;border:0;border-radius:6px;cursor:pointer}button:disabled{opacity:.6}button.secondary{background:#fff;color:#0b2949;border:2px solid #0b2949}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}nav button{background:#e8f1f8;color:#172d45}#msg{white-space:pre-wrap;color:#d00;margin-top:10px;min-height:24px}small{display:block;color:#526579;margin-top:4px}.selector{display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}.selector h2{margin:0 0 8px;font-size:1.25rem;color:#172d45}#selectorView,#formView{display:none}#selectorView{display:flex}.card-btn{background:#fff;border:2px solid #0b2949;color:#0b2949;width:min(320px,85vw);font-size:1.1rem;font-weight:700;padding:16px} .card-btn.primary{background:#0b2949;color:#fff;border-color:#0b2949}.pass-wrap{position:relative;display:flex;align-items:center;width:100%}.pass-wrap input{flex:1;padding-right:40px}.pass-eye{position:absolute;right:8px;background:none;border:none;cursor:pointer;padding:4px;font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center}</style><main><h1>Cotizador Pro</h1><p>Versión Android · Usuario</p>

<!-- Pantalla única: solo usuario -->
<div id="formView">
  <nav id="nav" style="margin-top:8px"><button type="button" data-mode="login">Iniciar sesión</button><button type="button" data-mode="register">Crear cuenta</button></nav>
  <h2 id="heading">Iniciar sesión</h2>
  <p id="help">Si ya tienes cuenta, ingresa aquí.</p>
  <form id="form"><label>Usuario o correo<input id="username" required autocomplete="username" placeholder="Tu usuario o nombre@correo.cl"></label><div id="extra" hidden><label id="pinLabel">PIN de invitación<input id="pin" autocomplete="one-time-code" placeholder="Solicítalo al administrador"></label><label>Nombre completo<input id="name" autocomplete="name"></label><label>Correo de recuperación<input id="email" type="email" autocomplete="email"></label><small>Opcional si ya escribiste un correo arriba.</small></div><label id="passwordLabel">Contraseña<div class="pass-wrap"><input id="password" type="password" required autocomplete="current-password"><button type="button" class="pass-eye" id="eyePassword" onclick="togglePassword('password')">👁️</button></div></label><div id="recovery" hidden><label>Código de recuperación<input id="code"></label></div><button type="submit" id="submit">Iniciar sesión</button></form><button type="button" id="forgot">Olvidé mi contraseña</button><p id="msg"></p></div></main><script>
let busy=false;const el=id=>document.getElementById(id);let modo='login';
const titles={setup:'Crear cuenta',register:'Crear cuenta',login:'Iniciar sesión',reset:'Restablecer contraseña'};
function togglePassword(id){const inp=el(id);const eye=el('eye'+id.charAt(0).toUpperCase()+id.slice(1));if(inp.type==='password'){inp.type='text';eye.textContent='🙈'}else{inp.type='password';eye.textContent='👁️'}}
function actualizarVista(){el('heading').textContent=titles[modo];el('submit').textContent=titles[modo];el('extra').hidden=!['setup','register'].includes(modo);el('recovery').hidden=modo!=='reset';el('pinLabel').hidden=modo!=='register';el('pin').required=modo==='register';el('password').autocomplete=modo==='login'?'current-password':'new-password';el('password').minLength=modo==='login'?1:10;el('help').textContent=modo==='register'?'Ingresa el PIN que te entregó el administrador para crear la cuenta y activar la licencia de este equipo.':modo==='reset'?'Solicita al administrador un código de un solo uso. Vence en 30 minutos.':'Si ya tienes cuenta, ingresa aquí.';el('msg').textContent=''}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{if(!busy){modo=b.dataset.mode;actualizarVista()}});el('forgot').onclick=()=>{if(!busy){modo='reset';actualizarVista()}};
fetch('/api/setup').then(r=>r.json()).then(d=>{if(d.needed){modo='setup';actualizarVista()}else{modo='login';actualizarVista()}}).catch(()=>{modo='login';actualizarVista()});
el('form').onsubmit=async e=>{e.preventDefault();if(busy)return;busy=true;el('submit').disabled=true;el('msg').textContent='Procesando…';try{const body={username:el('username').value,password:el('password').value,name:el('name').value,email:el('email').value,code:el('code').value,pin:el('pin').value};const r=await fetch('/api/auth/'+modo,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:AbortSignal.timeout(15000)});const d=await r.json();if(!r.ok)throw Error(d.detail);if(d.access_token){if(d.user.role==='admin'){throw Error('Esta versión no permite acceso de administrador. Usa la versión de escritorio.')}sessionStorage.setItem('cotizador_token',d.access_token);sessionStorage.setItem('cotizador_user',JSON.stringify(d.user));location='/app'}else{modo='login';actualizarVista();el('password').value='';el('msg').textContent='Cuenta creada. Ya puedes iniciar sesión.';el('password').focus()}}catch(err){el('msg').textContent=err.name==='TimeoutError'?'El servidor tardó demasiado. Vuelve a intentar.':err.message}finally{busy=false;el('submit').disabled=false}};
actualizarVista();
</script></html>
