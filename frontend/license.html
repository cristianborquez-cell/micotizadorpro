<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Activar licencia · Cotizador</title><style>body{font:16px system-ui;background:#0b2949;display:grid;place-items:center;min-height:95vh;margin:0}main{background:white;color:#172d45;border-radius:18px;padding:32px;width:min(450px,85vw)}input,button{width:100%;box-sizing:border-box;padding:12px;margin:8px 0}button{background:#087ebd;color:white;border:0;border-radius:6px;cursor:pointer}#msg{white-space:pre-wrap}</style><main><h1>Activar licencia</h1><p id="account">Comprobando tu cuenta…</p><p>Tu cuenta ya está registrada. Para usar el cotizador, ingresa el PIN que te entregó el administrador.</p><p>El PIN caduca a los 5 minutos si no lo usas. Una vez activado, la licencia sigue vigente hasta su cese.</p><form id="form"><label>PIN de licencia<input id="pin" required autocomplete="off" placeholder="PIN entregado por el administrador"></label><button id="activate">Activar en este equipo</button></form><p id="msg" role="status"></p><button id="logout" style="background:#fff;color:#0b2949;border:2px solid #0b2949">Cerrar sesión</button></main><script>
const token=sessionStorage.getItem('cotizador_token');if(!token)location='/';
async function api(p,x){const r=await fetch(p,{method:x?'POST':'GET',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:x?JSON.stringify(x):undefined,signal:(AbortSignal.timeout?AbortSignal.timeout(15000):undefined)});const d=await r.json().catch(()=>({}));if(r.status===401){sessionStorage.clear();location='/';throw Error('Inicia sesión nuevamente')}if(!r.ok)throw Error(d.detail||'Error');return d}
api('/api/license/status').then(d=>{document.getElementById('account').textContent='Sesión iniciada: '+d.username;if(d.active)location='/app'}).catch(e=>document.getElementById('msg').textContent=e.message);
document.getElementById('form').onsubmit=async e=>{e.preventDefault();const b=document.getElementById('activate');b.disabled=true;document.getElementById('msg').textContent='Validando PIN…';try{await api('/api/license/activate',{pin:document.getElementById('pin').value.trim()});location='/app'}catch(e){document.getElementById('msg').textContent=e.message}finally{b.disabled=false}};
document.getElementById('logout').onclick=async()=>{await api('/api/auth/logout',{}).catch(()=>{});sessionStorage.clear();location='/'};
</script></html>
