<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Activar licencia · Cotizador</title>
<style>
body{font:16px system-ui;background:#0b2949;display:grid;place-items:center;min-height:95vh;margin:0;color:#172d45}
main{background:#fff;border-radius:18px;padding:32px;width:min(560px,92vw)}
h1{margin:0 0 8px}p{line-height:1.45}
label{display:block;margin:10px 0 4px;font-weight:600}
input,button,textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #c8d5e1;border-radius:7px;font:inherit}
textarea{min-height:72px;resize:vertical}
button{background:#087ebd;color:#fff;border:0;cursor:pointer;margin-top:10px}
button:disabled{opacity:.6}
button.secondary{background:#fff;color:#0b2949;border:2px solid #0b2949}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:640px){.row{grid-template-columns:1fr}}
#msg{white-space:pre-wrap;margin-top:10px;min-height:24px}
small.hint{display:block;color:#60738a;font-weight:400;margin-top:2px}
.err{color:#b3261e}.ok{color:#17673b}
details{margin-top:18px;border-top:1px solid #dde;padding-top:14px}
summary{cursor:pointer;font-weight:600;color:#0b2949}
</style>
<main>
  <h1>Activar licencia</h1>
  <p id="account">Comprobando tu cuenta…</p>
  <p>Ingresa tus datos para solicitar la activación. Se enviará un correo con la información registrada.</p>

  <form id="dataForm" autocomplete="off">
    <div class="row">
      <div><label for="nombres">Nombres</label><input id="nombres" required maxlength="120"></div>
      <div><label for="apellidos">Apellidos</label><input id="apellidos" required maxlength="120"></div>
    </div>
    <div class="row">
      <div>
        <label for="run">RUN <small class="hint">Formato XXXXXXXX-X o K</small></label>
        <input id="run" required maxlength="12" placeholder="12345678-9" inputmode="text">
      </div>
      <div>
        <label for="rut">RUT <small class="hint">Formato XXXXXXXX-X o K</small></label>
        <input id="rut" required maxlength="12" placeholder="12345678-9" inputmode="text">
      </div>
    </div>
    <label for="razon">Razón social o nombre de fantasía</label><input id="razon" required maxlength="200">
    <div class="row">
      <div><label for="email">Correo electrónico</label><input id="email" type="email" required maxlength="254" placeholder="nombre@correo.cl"></div>
      <div><label for="telefono">Teléfono <small class="hint">Formato +56912345678</small></label><input id="telefono" required maxlength="20" placeholder="+56912345678" inputmode="tel"></div>
    </div>
    <label for="direccion">Dirección</label><textarea id="direccion" required maxlength="300"></textarea>
    <button id="btnDatos" type="submit">Ingresa mis datos</button>
  </form>
  <p id="msg" role="status"></p>

  <details id="pinBox">
    <summary>¿Ya tienes PIN? Activar licencia</summary>
    <form id="pinForm" autocomplete="off" style="margin-top:10px">
      <label for="pin">PIN de licencia</label>
      <input id="pin" autocomplete="off" placeholder="PIN entregado por el administrador">
      <button id="activate" type="submit" class="secondary">Activar con PIN</button>
    </form>
  </details>

  <button id="logout" class="secondary" style="margin-top:18px">Cerrar sesión</button>
</main>
<script>
const token=sessionStorage.getItem('cotizador_token');if(!token)location='/';
const el=id=>document.getElementById(id);
function setMsg(t,ok){const m=el('msg');m.textContent=t||'';m.className=ok?'ok':'err';}

function cleanRut(v){
  v=(v||'').toString().trim().toUpperCase().replace(/\./g,'').replace(/\s+/g,'');
  if(!v) return '';
  if(v.indexOf('-')===-1 && v.length>=2) v=v.slice(0,-1)+'-'+v.slice(-1);
  let parts=v.split('-'); let body=(parts[0]||'').replace(/[^0-9]/g,''); let dv=(parts[1]||'').replace(/[^0-9K]/g,'');
  if(body.length===7) body='0'+body; // 0 fantasma invisible para cumplir 8 dígitos
  return body+(dv?('-'+dv):'');
}
function rutValido(v){
  v=cleanRut(v);
  if(!/^\d{8}-[0-9K]$/.test(v)) return false;
  const body=v.split('-')[0], dv=v.split('-')[1];
  let mult=2,sum=0;
  for(let i=body.length-1;i>=0;i--){ sum+=parseInt(body[i],10)*mult; mult=mult<7?mult+1:2; }
  const rest=11-(sum%11);
  const dvCalc=rest===11?'0':rest===10?'K':String(rest);
  return dvCalc===dv;
}
function formatRutInput(inp){
  const pos=inp.selectionStart; const raw=inp.value;
  const cleaned=raw.toUpperCase().replace(/[^0-9Kk]/g,'');
  let out=cleaned;
  if(cleaned.length>1){ out=cleaned.slice(0,-1)+'-'+cleaned.slice(-1); }
  // normalize body to 8 digits when 7 entered
  if(out.indexOf('-')>-1){ const [b,d]=out.split('-'); if(b.length===7) out='0'+b+'-'+d; }
  inp.value=out.slice(0,10);
}

['run','rut'].forEach(id=>{ const inp=el(id); inp.addEventListener('input',()=>formatRutInput(inp)); inp.addEventListener('blur',()=>{inp.value=cleanRut(inp.value);}); });

async function api(p,x){
  const r=await fetch(p,{method:x?'POST':'GET',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:x?JSON.stringify(x):undefined,signal:(AbortSignal.timeout?AbortSignal.timeout(15000):undefined)});
  const d=await r.json().catch(()=>({}));
  if(r.status===401){sessionStorage.clear();location='/';throw Error('Inicia sesión nuevamente')}
  if(!r.ok)throw Error(d.detail||'Error');
  return d;
}

api('/api/license/status').then(d=>{el('account').textContent='Sesión iniciada: '+d.username; if(d.active) location='/app';}).catch(e=>setMsg(e.message,false));

el('dataForm').onsubmit=async e=>{
  e.preventDefault();
  const nombres=el('nombres').value.trim();
  const apellidos=el('apellidos').value.trim();
  const run=cleanRut(el('run').value);
  const razon=el('razon').value.trim();
  const rut=cleanRut(el('rut').value);
  const email=el('email').value.trim().toLowerCase();
  const telefono=el('telefono').value.trim().replace(/\s+/g,'');
  const direccion=el('direccion').value.trim();
  el('run').value=run; el('rut').value=rut; el('telefono').value=telefono;
  if(!nombres||!apellidos) return setMsg('Ingrese nombres y apellidos',false);
  if(!rutValido(run)) return setMsg('RUN inválido. Use formato XXXXXXXX-X o K con dígito verificador válido',false);
  if(!razon) return setMsg('Ingrese razón social o nombre de fantasía',false);
  if(!rutValido(rut)) return setMsg('RUT inválido. Use formato XXXXXXXX-X o K con dígito verificador válido',false);
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return setMsg('Ingrese un correo electrónico válido',false);
  if(!/^\+569\d{8}$/.test(telefono)) return setMsg('Teléfono inválido. Use formato +56912345678',false);
  if(!direccion) return setMsg('Ingrese dirección',false);
  const b=el('btnDatos'); b.disabled=true; setMsg('Enviando datos…',true);
  try{
    const d=await api('/api/license/request',{nombres,apellidos,run,razon_social:razon,rut,email,telefono,direccion});
    if(d.email_sent) setMsg('Datos enviados correctamente. Se envió el correo al cliente final.',true);
    else setMsg(d.detail||'Datos recibidos.',true);
    el('dataForm').reset();
  }catch(err){ setMsg(err.message,false); }
  finally{ b.disabled=false; }
};

el('pinForm').onsubmit=async e=>{
  e.preventDefault();
  const b=el('activate'); b.disabled=true; setMsg('Validando PIN…',true);
  try{ await api('/api/license/activate',{pin:el('pin').value.trim()}); location='/app'; }
  catch(err){ setMsg(err.message,false); }
  finally{ b.disabled=false; }
};

el('logout').onclick=async()=>{ await api('/api/auth/logout',{}).catch(()=>{}); sessionStorage.clear(); location='/'; };
</script></html>
