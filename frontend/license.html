<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Licencia · Cotizador</title><style>body{font:16px system-ui;background:#0b2949;display:grid;place-items:center;min-height:95vh;margin:0}main{background:white;color:#172d45;border-radius:18px;padding:32px;width:min(450px,85vw)}button{width:100%;box-sizing:border-box;padding:12px;margin:8px 0;background:#087ebd;color:white;border:0;border-radius:6px;cursor:pointer}#msg{white-space:pre-wrap}</style><main><h1>Licencia</h1><p id="account">Comprobando tu cuenta…</p><p id="msg" role="status"></p><button id="logout" style="background:#fff;color:#0b2949;border:2px solid #0b2949">Salir</button></main><script>
const token=sessionStorage.getItem('cotizador_token');if(!token)location='/';
async function api(p,x){const r=await fetch(p,{method:x?'POST':'GET',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:x?JSON.stringify(x):undefined,signal:(AbortSignal.timeout?AbortSignal.timeout(15000):undefined)});const d=await r.json().catch(()=>({}));if(r.status===401){sessionStorage.clear();location='/';throw Error('Inicia sesión nuevamente')}if(!r.ok)throw Error(d.detail||'Error');return d}
api('/api/license/status').then(d=>{document.getElementById('account').textContent='Sesión iniciada: '+d.username;if(d.active){location='/app';return;}document.getElementById('msg').textContent='Tu cuenta no tiene una licencia activa en este equipo. La licencia se activa al crear la cuenta con el PIN del administrador. Contacta al administrador.'}).catch(e=>document.getElementById('msg').textContent=e.message);
document.getElementById('logout').onclick=async()=>{await api('/api/auth/logout',{}).catch(()=>{});sessionStorage.clear();location='/'};
</script></html>
